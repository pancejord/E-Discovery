services:
  backend:
    build:
      context: ./backend
    container_name: ediscovery-backend
    profiles: ["app", "app-postgres", "full"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      DATABASE_AUTO_CREATE_TABLES: ${DATABASE_AUTO_CREATE_TABLES:-false}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/storage/app.db}
      UPLOAD_DIR: /app/storage/uploads
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_ENABLED: ${QDRANT_ENABLED:-false}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      STRUCTURED_LOGS: ${STRUCTURED_LOGS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_BEARER_ENABLED: ${AUTH_BEARER_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_EXTERNAL_ENABLED: ${AI_EXTERNAL_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_PDF_TO_TEXT_COMMAND: ${OCR_PDF_TO_TEXT_COMMAND:-}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: ediscovery-frontend
    profiles: ["app", "app-postgres", "full"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: ediscovery-postgres
    profiles: ["postgres", "app-postgres", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ediscovery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ediscovery}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: ediscovery-qdrant
    profiles: ["qdrant", "full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_storage:
  postgres_data:
  qdrant_data:
