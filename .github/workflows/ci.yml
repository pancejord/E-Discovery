name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_service_checks:
        description: "Run Docker-backed Qdrant checks"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile backend
        run: python -m compileall -q app

      - name: Check migrations
        env:
          DATABASE_URL: sqlite:///./tmp_ci_migration.db
        run: python -m alembic upgrade head

      - name: Check migration drift
        working-directory: .
        run: python scripts/check_migration_drift.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  qdrant-smoke:
    name: Optional Qdrant Smoke
    if: github.event_name == 'workflow_dispatch' && inputs.run_service_checks == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start Qdrant
        working-directory: .
        run: docker compose up -d qdrant

      - name: Run Qdrant integration tests
        env:
          QDRANT_ENABLED: "true"
        run: python -m pytest tests/test_qdrant_integration.py -q

      - name: Stop Qdrant
        if: always()
        working-directory: .
        run: docker compose stop qdrant
